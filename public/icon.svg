<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Gift Box Body -->
  <g filter="url(#glow)">
    <!-- Main Box Container -->
    <rect x="116" y="220" width="280" height="190" rx="18" fill="#ffffff" />
    <!-- Box Lid -->
    <rect x="96" y="175" width="320" height="50" rx="12" fill="#fff1f2" />
    
    <!-- Vertical Gold Ribbon -->
    <rect x="232" y="175" width="48" height="235" fill="url(#goldGrad)" />
    <!-- Horizontal Gold Ribbon -->
    <rect x="116" y="300" width="280" height="36" fill="url(#goldGrad)" />
    
    <!-- Ribbon Bow Left -->
    <path d="M256 180 C200 120 150 140 170 180 C185 200 230 190 256 185 Z" fill="url(#goldGrad)" />
    <!-- Ribbon Bow Right -->
    <path d="M256 180 C312 120 362 140 342 180 C327 200 282 190 256 185 Z" fill="url(#goldGrad)" />
    <!-- Bow Knot Center -->
    <circle cx="256" cy="180" r="16" fill="#d97706" />
    
    <!-- Brand Letter 'G' inside box -->
    <text x="256" y="380" font-family="'Cairo', sans-serif" font-size="64" font-weight="900" fill="#be185d" text-anchor="middle">G</text>
  </g>

  <!-- Sparkles -->
  <path d="M120 130 L126 146 L142 152 L126 158 L120 174 L114 158 L98 152 L114 146 Z" fill="#fef08a" opacity="0.9" />
  <path d="M390 120 L394 132 L406 136 L394 140 L390 152 L386 140 L374 136 L386 132 Z" fill="#fef08a" opacity="0.85" />
  <path d="M410 270 L413 279 L422 282 L413 285 L410 294 L407 285 L398 282 L407 279 Z" fill="#fef08a" opacity="0.8" />
</svg>
